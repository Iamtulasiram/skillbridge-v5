<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillBridge V4</title><style>
:root{--bg:#050816;--panel:#0b1224;--panel2:#101a32;--line:#2a3a5d;--text:#eef5ff;--muted:#91a2c0;--cyan:#31e6df;--purple:#8c6cff;--danger:#ff5470;--ok:#4ee59b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#1b1748 0,#091128 32%,#050816 70%);color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.auth{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}.orb{position:absolute;width:460px;height:460px;border-radius:50%;filter:blur(80px);opacity:.22;background:linear-gradient(135deg,var(--cyan),var(--purple));animation:float 8s ease-in-out infinite}.orb.one{top:-200px;left:-150px}.orb.two{right:-180px;bottom:-220px;animation-delay:-3s}@keyframes float{50%{transform:translate(30px,25px) scale(1.08)}}.authbox{position:relative;width:min(480px,100%);padding:34px;border:1px solid #34466e;border-radius:26px;background:linear-gradient(145deg,#0d1730f2,#070d1cf7);box-shadow:0 0 0 1px #8c6cff14,0 0 55px #5c4cff28,0 25px 90px #0009;animation:enter .55s ease}.authbox:after{content:"";position:absolute;inset:-2px;border-radius:28px;background:linear-gradient(120deg,transparent 15%,#31e6df55,transparent 42%,#8c6cff55,transparent 72%);filter:blur(10px);opacity:.5;z-index:-1;animation:shine 6s linear infinite}@keyframes shine{50%{transform:rotate(180deg)}}@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#050816;box-shadow:0 0 28px #31e6df55}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}.field{margin:14px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.field input,.field select{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#071022;color:#fff;outline:none;transition:.2s}.field select option{background:#0b1224;color:#eef5ff}.field input:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #31e6df18,0 0 20px #31e6df18}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:800;background:linear-gradient(135deg,var(--cyan),#27bdb8);color:#041019;transition:.2s;box-shadow:0 8px 25px #31e6df20}.btn:hover{transform:translateY(-2px);box-shadow:0 0 28px #31e6df45}.sec{background:#111e38;color:#eaf3ff;border:1px solid var(--line);box-shadow:none}.err{color:#ff9bad;background:#2b1019;border:1px solid #762b3f;padding:11px 13px;border-radius:10px;margin:10px 0;box-shadow:0 0 18px #ff547018}.ok{color:#72efb1;background:#0d2b20;border:1px solid #216f50;padding:11px 13px;border-radius:10px;margin:10px 0}.hint{font-size:12px;color:var(--muted)}.status{font-size:12px;margin-top:12px;padding:9px 11px;border-radius:9px;background:#0b1529;border:1px solid var(--line);color:var(--muted)}.login-quote{margin:24px 0 8px;padding:15px 16px;border-left:3px solid var(--cyan);background:linear-gradient(90deg,#31e6df10,transparent);color:#dffcff;font-size:15px;line-height:1.55;animation:quoteIn .8s ease}.tagline{font-size:10px;letter-spacing:.2em;color:#a99aff;font-weight:900;margin-bottom:16px}.glowbtn{position:relative;overflow:hidden}.glowbtn:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff55 48%,transparent 65%);transform:translateX(-120%);animation:btnshine 3.8s infinite}@keyframes btnshine{55%,100%{transform:translateX(120%)}}@keyframes quoteIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}.layout{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.top{height:70px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);background:#050816ef;backdrop-filter:blur(15px);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.aside{border-right:1px solid var(--line);background:#070d1a;padding:22px 14px}.nav button{width:100%;padding:12px;text-align:left;background:transparent;border:0;color:var(--muted);border-radius:10px;margin:3px 0}.nav button:hover,.nav .active{background:#111e38;color:#fff}.main{padding:30px;max-width:1450px;width:100%;margin:auto}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:25px;align-items:center}.ey{color:var(--cyan);font-size:12px;font-weight:900;letter-spacing:.12em}.hero h1{font-size:clamp(42px,6vw,76px);line-height:.96;margin:12px 0}.panel,.card{background:linear-gradient(145deg,#0d1830,#091225);border:1px solid var(--line);border-radius:18px;padding:21px}.bridges,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.bridge{padding:17px;border:1px solid var(--line);border-radius:14px;background:#0a1428}.metric{font-size:42px;font-weight:900}.muted{color:var(--muted)}.progress{height:9px;border-radius:99px;background:#182641;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:.5s}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.tag{display:inline-block;border:1px solid var(--line);background:#101f39;color:#c5d5eb;padding:5px 9px;border-radius:999px;font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left}.career-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-height:52vh;overflow:auto;padding-right:5px}.career{padding:16px;border:1px solid var(--line);border-radius:14px;background:#0a1428;color:var(--text);cursor:pointer;transition:.2s;text-align:left;width:100%;font:inherit;appearance:none;-webkit-appearance:none}.career b,.career p{color:inherit}.career .muted{color:var(--muted)}.career:hover,.career.selected{border-color:var(--cyan);box-shadow:0 0 22px #31e6df18;transform:translateY(-2px)}.skill{display:grid;grid-template-columns:1.5fr 1.7fr 1.5fr;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.assignment{padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:#081225;color:#dbe8ff;line-height:1.45}.level-options{display:flex;gap:7px;flex-wrap:wrap}.level-btn{border:1px solid var(--line);background:#0a1428;color:#c9d7ed;padding:9px 11px;border-radius:10px;font-weight:800;transition:.2s}.level-btn:hover,.level-btn.active{border-color:var(--cyan);color:#fff;background:#0d2c39;box-shadow:0 0 18px #31e6df22;transform:translateY(-1px)}.small{font-size:12px}.opps{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:950px){.layout{grid-template-columns:190px 1fr}.hero{grid-template-columns:1fr}.bridges,.grid{grid-template-columns:1fr 1fr}.career-grid{grid-template-columns:1fr 1fr}.opps{grid-template-columns:1fr}}@media(max-width:650px){.layout{display:block}.aside{border-right:0;border-bottom:1px solid var(--line)}.main{padding:18px}.bridges,.grid,.career-grid{grid-template-columns:1fr}.skill{grid-template-columns:1fr}.level-options{grid-template-columns:1fr}.top{padding:0 12px}.top{padding:0 12px}.top .tag{display:none}}
</style></head><body><div id="root"></div><script>
'use strict';
const root=document.getElementById('root');let user=null,catalog=null,selectedCareer='';
const api=async(path,opts={})=>{let r;try{r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts})}catch(e){throw new Error('⚠ Cannot connect to SkillBridge backend. Start START_SKILLBRIDGE.bat first.')}let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(msg,bad=false){const x=document.createElement('div');x.className='err';x.style.position='fixed';x.style.right='20px';x.style.bottom='20px';x.style.zIndex='50';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),3000)}
function authPage(mode='login',message=''){selectedCareer='';root.innerHTML=`<div class="auth"><div class="orb one"></div><div class="orb two"></div><div class="authbox"><div class="brand"><div class="logo">SB</div><div>SkillBridge<small>Graduate → Industry Intelligence</small></div></div>${mode==='login'?`<div class="login-quote">“Your skills are the bridge between where you are and where industry needs you.”</div><div class="tagline">ASSESS. BRIDGE. BUILD. GET HIRED.</div><h1>Welcome back</h1><p class="muted">Turn your skills into a career direction, roadmap and opportunity path.</p><div id="loginErr">${message?`<div class="err">${esc(message)}</div>`:''}</div><form id="loginForm"><div class="field"><label>Email address</label><input id="loginEmail" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password" required></div><button class="btn glowbtn" type="submit" style="width:100%">Sign In</button></form><div class="actions"><button class="btn sec" id="createBtn" type="button" style="width:100%">Create Account</button></div><p class="hint">Wrong credentials show a red ⚠ warning. Your data is stored in the SkillBridge backend.</p><div id="backendStatus" class="status">Checking backend...</div>`:`<h1>Create your account</h1><p class="muted">Create an account first. Then SkillBridge assesses your foundation skills before recommending career paths.</p><div id="signupErr"></div><form id="signupForm"><div class="field"><label>Full name</label><input id="signupName" autocomplete="name" placeholder="Your full name" required></div><div class="field"><label>Email address</label><input id="signupEmail" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label>Password</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="8+ chars, upper, lower, number, special" required></div><p class="hint">Minimum 8 characters + uppercase + lowercase + number + special character.</p><button class="btn glowbtn" type="submit">Create Account</button></form><div class="actions"><button class="btn sec" id="backBtn" type="button">Back to Login</button></div>`}</div></div>`;if(mode==='login'){document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();signin()});document.getElementById('createBtn').addEventListener('click',()=>authPage('signup'));checkBackend()}else{document.getElementById('signupForm').addEventListener('submit',e=>{e.preventDefault();signup()});document.getElementById('backBtn').addEventListener('click',()=>authPage('login'))}}
async function checkBackend(){const el=document.getElementById('backendStatus');try{await api('/api/health');el.innerHTML='● Backend connected · data storage ready';el.style.color='var(--ok)'}catch(e){el.innerHTML='● Backend offline · run START_SKILLBRIDGE.bat';el.style.color='var(--danger)'}}
async function signin(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value,box=document.getElementById('loginErr');box.innerHTML='';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){box.innerHTML='<div class="err">⚠ Invalid email address.</div>';return}if(!password){box.innerHTML='<div class="err">⚠ Please enter your password.</div>';return}try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({email,password})});user=r.user;await loadCatalog();if(r.next==='foundation')foundationPage();else if(r.next==='career')careerPage();else dashboard()}catch(e){box.innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function signup(){const name=document.getElementById('signupName').value.trim(),email=document.getElementById('signupEmail').value.trim(),password=document.getElementById('signupPassword').value,box=document.getElementById('signupErr');box.innerHTML='';if(name.length<2){box.innerHTML='<div class="err">⚠ Enter your full name.</div>';return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){box.innerHTML='<div class="err">⚠ Invalid email address.</div>';return}if(password.length<8||!/[A-Z]/.test(password)||!/[a-z]/.test(password)||!/[0-9]/.test(password)||!/[^A-Za-z0-9]/.test(password)){box.innerHTML='<div class="err">⚠ Password needs 8+ characters, uppercase, lowercase, number and special character.</div>';return}try{const r=await api('/api/signup',{method:'POST',body:JSON.stringify({name,email,password})});user=r.user;await loadCatalog();foundationPage()}catch(e){box.innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function loadCatalog(){catalog=await api('/api/catalog')}
function foundationPage(){const skills=catalog.foundationSkills||[];root.innerHTML=`<div class="auth"><div class="authbox" style="width:min(1050px,100%)"><div class="brand"><div class="logo">SB</div><div>SkillBridge<small>Foundation assessment</small></div></div><div class="ey" style="margin-top:24px">STEP 1 · SKILL FOUNDATION</div><h1>Assess your current skill level</h1><p class="muted">Choose <b>Beginner</b>, <b>Intermediate</b> or <b>Advanced</b>. No percentages here. SkillBridge uses these levels to suggest career families.</p><div class="card">${skills.map((s,i)=>`<div class="skill"><div><b>${esc(s)}</b><div class="small muted">Foundation skill ${i+1}</div></div><div class="assignment">Rate your current practical ability in ${esc(s)}.</div><div class="level-options">${['Beginner','Intermediate','Advanced'].map(v=>`<button type="button" class="level-btn" data-foundation="${esc(s)}" data-level="${v}">${v}</button>`).join('')}</div></div>`).join('')}<div class="actions"><button class="btn" id="saveFoundation">Analyze My Skills →</button><button class="btn sec" id="foundationLogout">Sign out</button></div></div></div></div>`;const levels={...(user.foundationLevels||{})};document.querySelectorAll('[data-foundation]').forEach(b=>b.addEventListener('click',()=>{const skill=b.dataset.foundation;document.querySelectorAll(`[data-foundation="${CSS.escape(skill)}"]`).forEach(x=>x.classList.remove('active'));b.classList.add('active');levels[skill]=b.dataset.level;}));Object.entries(levels).forEach(([skill,v])=>{const b=document.querySelector(`[data-foundation="${CSS.escape(skill)}"][data-level="${CSS.escape(v)}"]`);if(b)b.classList.add('active')});document.getElementById('saveFoundation').addEventListener('click',async()=>{if(Object.keys(levels).length<6){toast('⚠ Rate at least 6 foundation skills before analyzing.',true);return}try{const r=await api('/api/foundation',{method:'PUT',body:JSON.stringify({levels})});user=r.user;careerPage(r.recommendations)}catch(e){toast(e.message,true)}});document.getElementById('foundationLogout').addEventListener('click',logout)}
function careerPage(recs=user.recommendations||[]){const cats=Object.keys(catalog.careers);const recommended=(recs||[]).slice(0,6);root.innerHTML=`<div class="auth"><div class="authbox" style="width:min(1180px,100%)"><div class="brand"><div class="logo">SB</div><div>SkillBridge<small>Career intelligence</small></div></div><div class="ey" style="margin-top:25px">STEP 2 · CAREER RECOMMENDATION</div><h1>Career paths suggested from your skills</h1><p class="muted">Your foundation assessment is used to rank career families. You can choose any career path from the full catalogue.</p>${recommended.length?`<div class="recommendations"><h3>Recommended career families</h3><div class="rec-grid">${recommended.map(r=>`<div class="rec"><b>${esc(r.category)}</b><span>${r.score}% skill-fit signal</span></div>`).join('')}</div></div>`:''}<div class="field"><input id="careerSearch" placeholder="Search any career: AI Engineer, Designer, Lawyer, Engineer..." autocomplete="off"></div><div id="careerGrid" class="career-grid">${careerCards(cats)}</div><div id="selectedCareerInfo" class="status">No career selected yet.</div><div class="actions"><button class="btn" id="continueCareer">Continue to Career Assignments →</button><button class="btn sec" id="careerLogout">Sign out</button></div></div></div>`;document.getElementById('careerSearch').addEventListener('input',filterCareers);document.querySelectorAll('.career').forEach(card=>card.addEventListener('click',()=>selectCareer(card)));document.getElementById('continueCareer').addEventListener('click',startAssessment);document.getElementById('careerLogout').addEventListener('click',logout)}
function careerCards(cats){return cats.flatMap(cat=>catalog.careers[cat].map(role=>`<button class="career" data-career="${esc(role)}" data-text="${esc(cat+' '+role)}"><b>${esc(role)}</b><p class="muted small">${esc(cat)}</p><p class="small">Career-specific skill assignments</p></button>`)).join('')}
function filterCareers(){const q=document.getElementById('careerSearch').value.toLowerCase();document.querySelectorAll('.career').forEach(x=>x.style.display=x.dataset.text.toLowerCase().includes(q)?'block':'none')}
function selectCareer(card){document.querySelectorAll('.career.selected').forEach(x=>x.classList.remove('selected'));card.classList.add('selected');selectedCareer=card.dataset.career;document.getElementById('selectedCareerInfo').innerHTML=`<span style="color:var(--cyan);font-weight:800">✓ Selected:</span> ${esc(selectedCareer)} <span class="muted">• click Continue to begin assignments</span>`;}
function startAssessment(){const selected=document.querySelector('.career.selected');if(!selected){toast('⚠ Select a career path first.',true);return}selectedCareer=selected.dataset.career;user.profile.career=selectedCareer;renderAssessment()}
function level(v){return v==='Advanced'||Number(v)>=80?'Advanced':v==='Intermediate'||Number(v)>=50?'Intermediate':'Beginner'}
function levelScore(v){return ({Beginner:35,Intermediate:65,Advanced:90})[v]||0}
function readiness(){const vals=Object.values(user.assignmentLevels||{}).map(levelScore).filter(Boolean);return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0}
const ASSIGNMENT_PROMPTS={
  'Python':'Build a small program that reads input, processes data and produces a useful output.',
  'SQL':'Write queries using filtering, grouping, joins and a business question.',
  'Excel':'Create a spreadsheet using formulas, lookup logic and a simple analysis.',
  'Statistics':'Explain a dataset using mean, variation, probability and one practical insight.',
  'Machine Learning':'Describe a supervised learning workflow and choose an evaluation metric.',
  'Data Structures & Algorithms':'Solve a small problem and explain the time/space trade-off.',
  'Git & GitHub':'Create a branch, commit changes and explain a clean collaboration workflow.',
  'Communication':'Explain a technical result clearly to a non-technical stakeholder.',
  'Problem Solving':'Break an unfamiliar problem into assumptions, steps and a testable solution.',
  'Networking':'Explain IP, DNS, HTTP and how a request travels from client to server.',
  'Cloud Fundamentals':'Design a simple cloud architecture for a small application.',
  'Cybersecurity':'Identify common threats and propose basic preventive controls.',
  'Design Fundamentals':'Create a user-focused interface concept and justify the visual decisions.',
  'Figma':'Create a reusable interface component and a simple prototype flow.',
  'User Research':'Write a short research plan and identify user pain points.',
  'Business Analysis':'Turn a business problem into requirements, stakeholders and acceptance criteria.',
  'Financial Modeling':'Build a simple model and explain assumptions, revenue, cost and risk.',
  'Marketing':'Design a small campaign and define measurable acquisition metrics.',
  'Writing':'Produce a clear structured piece for a defined audience.',
  'Research':'Find evidence, compare sources and summarize a defensible conclusion.',
  'Project Management':'Create a small project plan with scope, milestones, risks and ownership.'
};
function promptFor(skill){return ASSIGNMENT_PROMPTS[skill]||`Complete a practical ${skill} task and explain your approach, result and what you would improve next.`}
function renderAssessment(){const skills=catalog.skills[Object.keys(catalog.careers).find(k=>catalog.careers[k].includes(user.profile.career))]||[];const existing=user.assignmentLevels||{};root.innerHTML=`<div class="auth"><div class="authbox" style="width:min(1080px,100%)"><div class="brand"><div class="logo">SB</div><div>SkillBridge<small>Career-specific assignments</small></div></div><div class="ey" style="margin-top:24px">STEP 3 · CAREER SKILL ASSESSMENT</div><h1>${esc(user.profile.career)}</h1><p class="muted">For each practical assignment, choose the level that best matches your current ability. Your final percentage is calculated from these selections.</p><div class="card">${skills.map((s,i)=>`<div class="skill"><div><b>${esc(s)}</b><div class="small muted">Assignment ${i+1}</div></div><div class="assignment">${esc(promptFor(s))}</div><div class="level-options">${['Beginner','Intermediate','Advanced'].map(v=>`<button type="button" class="level-btn ${existing[s]===v?'active':''}" data-assignment="${esc(s)}" data-level="${v}">${v}</button>`).join('')}</div></div>`).join('')}<div class="actions"><button class="btn" id="saveAssessment">Submit Assignments & Get Results →</button><button class="btn sec" id="backCareer">Back to Career Paths</button></div></div></div></div>`;const levels={...existing};document.querySelectorAll('[data-assignment]').forEach(b=>b.addEventListener('click',()=>{const skill=b.dataset.assignment;document.querySelectorAll(`[data-assignment="${CSS.escape(skill)}"]`).forEach(x=>x.classList.remove('active'));b.classList.add('active');levels[skill]=b.dataset.level}));document.getElementById('saveAssessment').addEventListener('click',()=>saveAssessment(levels));document.getElementById('backCareer').addEventListener('click',()=>careerPage())}
async function saveAssessment(levels){if(Object.keys(levels).length<4){toast('⚠ Complete at least 4 career assignments.',true);return}const scores=Object.fromEntries(Object.entries(levels).map(([s,v])=>[s,levelScore(v)]));try{const r=await api('/api/assessment',{method:'PUT',body:JSON.stringify({career:user.profile.career,levels,assignments:scores,skills:levels})});user=r.user;resultsPage(r.readiness)}catch(e){toast(e.message,true)}}
function resultsPage(readinessValue){const r=readinessValue??readiness();const category=Object.keys(catalog.careers).find(k=>catalog.careers[k].includes(user.profile.career));const familyJobs=catalog.jobs.filter(j=>j.category===category);const vals=Object.entries(user.assignmentLevels||{});root.innerHTML=`<div class="auth"><div class="authbox" style="width:min(1100px,100%)"><div class="brand"><div class="logo">SB</div><div>SkillBridge<small>Assessment results</small></div></div><div class="ey">STEP 4 · RESULTS</div><h1>${r}% readiness</h1><p class="muted">Your result is calculated from the Beginner / Intermediate / Advanced levels selected for your ${esc(user.profile.career)} assignments.</p><div class="panel"><div class="metric">${r}%</div><div class="progress"><div class="bar" style="width:${r}%"></div></div><p class="muted">${r>=80?'Strong foundation for project and interview preparation.':r>=60?'Develop your medium-level gaps through projects and guided practice.':'Focus on fundamentals and complete targeted practice before applying.'}</p></div><div class="card" style="margin-top:16px"><h3>Assignment results</h3><table class="table"><tr><th>Skill</th><th>Selected level</th><th>Score used</th></tr>${vals.map(([s,v])=>`<tr><td>${esc(s)}</td><td>${esc(v)}</td><td>${levelScore(v)}%</td></tr>`).join('')}</table></div><div class="card" style="margin-top:16px"><h3>Career-matched internship opportunities</h3><p class="muted small">Sample prototype opportunities matched to ${esc(category)}. Verify live openings on official sites.</p>${familyJobs.length?familyJobs.map(j=>`<div class="skill"><div><b>${esc(j.title)}</b><div class="small muted">${esc(j.company)} · ${esc(j.type)}</div></div><div class="assignment">Matched to your selected career family.</div><button class="btn" data-job="${esc(j.url)}">View official careers</button></div>`).join(''):'<p class="muted">No sample opportunity is configured for this career family yet.</p>'}</div><div class="actions"><button class="btn" id="resultsDash">Open Dashboard</button><button class="btn sec" id="resultsOpp">View All Opportunities</button></div></div></div>`;document.querySelectorAll('[data-job]').forEach(b=>b.addEventListener('click',()=>window.open(b.dataset.job,'_blank')));document.getElementById('resultsDash').addEventListener('click',dashboard);document.getElementById('resultsOpp').addEventListener('click',opportunities)}
function shell(active,content){root.innerHTML=`<header class="top"><div class="brand"><div class="logo">SB</div><div>SkillBridge<small>From Learning Skills to Building Careers</small></div></div><div><span class="tag">${esc(user.name)}</span> <button class="btn sec" id="logoutBtn">Logout</button></div></header><div class="layout"><aside class="aside"><nav class="nav">${[['dashboard','▦ Dashboard'],['assessment','◈ Assignments'],['progress','◔ Progress'],['roadmap','⌁ Roadmap'],['opportunities','⌕ Opportunities'],['profile','◎ My Profile'],['history','◷ History']].map(x=>`<button class="${active===x[0]?'active':''}" data-go="${x[0]}">${x[1]}</button>`).join('')}</nav></aside><main class="main">${content}</main></div>`;document.getElementById('logoutBtn').addEventListener('click',logout);document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)))}
function go(p){if(p==='dashboard')dashboard();if(p==='assessment')renderAssessment();if(p==='progress')progress();if(p==='roadmap')roadmap();if(p==='opportunities')opportunities();if(p==='profile')profile();if(p==='history')history()}
function dashboard(){const r=readiness();const skills=Object.keys(user.assignments||{});shell('dashboard',`<div class="hero"><div><div class="ey">SDG 8 · DECENT WORK AND ECONOMIC GROWTH</div><h1>From skills to a career path.</h1><p class="muted">Four bridges connect your current abilities to industry expectations: assessment, gap analysis, roadmap and opportunity matching.</p><div class="actions"><button class="btn" id="dashAssess">Take / Update Assignments</button><button class="btn sec" id="dashOpp">Explore Opportunities</button></div></div><div class="panel"><div class="ey">TARGET CAREER</div><h2>${esc(user.profile.career||'Not selected')}</h2><div class="metric">${r}%</div><span class="muted">Assignment-based job readiness</span><div class="progress" style="margin-top:14px"><div class="bar" style="width:${r}%"></div></div><p class="muted small">Based on ${skills.length} completed assignment${skills.length===1?'':'s'}.</p></div></div><h2 style="margin-top:32px">Four bridges</h2><div class="bridges"><div class="bridge"><b>01 · Skill Assessment</b><p class="muted">Assignments measure current competency.</p></div><div class="bridge"><b>02 · Skill Gap Analysis</b><p class="muted">Compare assignment results with target level.</p></div><div class="bridge"><b>03 · Personalized Roadmap</b><p class="muted">Turn low scores into next actions.</p></div><div class="bridge"><b>04 · Job & Internship Matching</b><p class="muted">Connect the profile to opportunity types.</p></div></div><div class="card" style="margin-top:18px"><h3>Completed assignment snapshot</h3>${skills.length?`<table class="table"><tr><th>Skill</th><th>Level</th><th>Score used</th></tr>${skills.map(s=>{const lv=user.assignmentLevels?.[s]||level(user.assignments[s]);const v=levelScore(lv);return `<tr><td><b>${esc(s)}</b></td><td>${esc(lv)}</td><td>${v}%</td></tr>`}).join('')}</table>`:'<p class="muted">No career assignments completed yet.</p>'}</div>`);document.getElementById('dashAssess').addEventListener('click',renderAssessment);document.getElementById('dashOpp').addEventListener('click',opportunities)}
function progress(){const r=readiness(),n=Object.keys(user.assignments||{}).length; shell('progress',`<div class="ey">PROGRESS</div><h2>Your growth dashboard</h2><div class="grid"><div class="card"><div class="muted">Readiness</div><div class="metric">${r}%</div><div class="progress"><div class="bar" style="width:${r}%"></div></div></div><div class="card"><div class="muted">Assignments taken</div><div class="metric">${n}</div></div><div class="card"><div class="muted">Career</div><div class="metric" style="font-size:22px">${esc(user.profile.career)}</div></div><div class="card"><div class="muted">Assessment attempts</div><div class="metric">${user.history?.length||0}</div></div></div><div class="card" style="margin-top:18px"><h3>Readiness history</h3>${user.history?.length?`<table class="table"><tr><th>Date</th><th>Career</th><th>Readiness</th></tr>${user.history.map(h=>`<tr><td>${new Date(h.date).toLocaleString()}</td><td>${esc(h.career)}</td><td>${h.readiness}%</td></tr>`).join('')}</table>`:'<p class="muted">Complete an assignment to create history.</p>'}</div>`)}
function roadmap(){const skills=Object.keys(user.assignments||{});shell('roadmap',`<div class="ey">03 · PERSONALIZED ROADMAP</div><h2>${esc(user.profile.career)} roadmap</h2><p class="muted">Roadmap actions are based on completed assignment scores.</p><div class="grid">${(skills.length?skills:['Complete an assignment first']).map(s=>{const v=Number(user.assignments?.[s]||0);return `<div class="card"><span class="tag">${v>=70?'On target':v>=40?'Develop':'Priority gap'}</span><h3>${esc(s)}</h3><p class="muted">${skills.length?v+'% assignment score':'No score yet'}</p><div class="progress"><div class="bar" style="width:${v}%"></div></div><p class="small muted">${v<40?'Build basics → guided practice → retake assignment':v<70?'Strengthen intermediate concepts → project → retake assignment':'Advanced practice → portfolio project → interview preparation'}</p></div>`}).join('')}</div>`)}
function opportunities(){const category=Object.keys(catalog.careers).find(k=>catalog.careers[k].includes(user.profile.career));const jobs=catalog.jobs.filter(o=>!category||o.category===category);shell('opportunities',`<div class="ey">04 · OPPORTUNITY MATCHING</div><h2>${esc(user.profile.career)} opportunities</h2><p class="muted">Showing prototype opportunities matched to your selected career family: <b>${esc(category||'General')}</b>.</p><div class="opps">${(jobs.length?jobs:catalog.jobs).map(o=>`<article class="card"><span class="tag">${esc(o.type)}</span><h3>${esc(o.title)}</h3><b>${esc(o.company)}</b><p class="muted">Matched career family: ${esc(o.category)}</p><button class="btn" data-job="${esc(o.url)}">Official career page</button></article>`).join('')}</div>`);document.querySelectorAll('[data-job]').forEach(b=>b.addEventListener('click',()=>window.open(b.dataset.job,'_blank')))}
function profile(){shell('profile',`<div class="ey">MY PROFILE</div><h2>Student profile</h2><div class="card"><div class="field"><label>Full name</label><input value="${esc(user.name)}" disabled></div><div class="field"><label>Email</label><input value="${esc(user.email)}" disabled></div><div class="field"><label>Phone</label><input id="pPhone" value="${esc(user.profile.phone)}"></div><div class="field"><label>Degree / Course</label><input id="pDegree" value="${esc(user.profile.degree)}"></div><div class="field"><label>Academic year</label><select id="pYear">${['1st Year','2nd Year','3rd Year','4th Year'].map(x=>`<option ${user.profile.year===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>College / Institute</label><input id="pCollege" value="${esc(user.profile.college)}"></div><p class="muted">Career: <b>${esc(user.profile.career)}</b></p><button class="btn" id="saveProfile">Save Profile</button></div>`);document.getElementById('saveProfile').addEventListener('click',saveProfile)}
async function saveProfile(){try{const r=await api('/api/profile',{method:'PUT',body:JSON.stringify({phone:document.getElementById('pPhone').value.trim(),degree:document.getElementById('pDegree').value.trim(),year:document.getElementById('pYear').value,college:document.getElementById('pCollege').value.trim(),career:user.profile.career})});user=r.user;toast('Profile stored in backend.')}catch(e){toast(e.message,true)}}
function history(){shell('history',`<div class="ey">HISTORY</div><h2>Assessment history</h2><div class="card">${user.history?.length?`<table class="table"><tr><th>Date</th><th>Career</th><th>Readiness</th></tr>${user.history.map(h=>`<tr><td>${new Date(h.date).toLocaleString()}</td><td>${esc(h.career)}</td><td>${h.readiness}%</td></tr>`).join('')}</table>`:'<p class="muted">No assessment history yet.</p>'}</div>`)}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}user=null;authPage('login')}
window.addEventListener('error',e=>{console.error(e.error||e.message);toast('⚠ Frontend error: '+e.message,true)});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast('⚠ '+(e.reason?.message||e.reason||'Unexpected error'),true)});
(async()=>{try{await api('/api/health');const m=await api('/api/me');user=m.user;await loadCatalog();if(user.profile.career)dashboard();else if(Object.keys(user.foundationLevels||{}).length)careerPage();else foundationPage()}catch(e){authPage('login')}})();
</script></body></html>
